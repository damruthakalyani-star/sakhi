name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend-quality:
    name: Backend Lint, Typecheck & Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Dependency Integrity Check
        run: pip check

      - name: Ruff Linter
        run: ruff check backend

      - name: Black Code Formatter
        run: black --check backend

      - name: Mypy Type Checker
        run: mypy backend/app --ignore-missing-imports

      - name: Run Pytest with Coverage
        env:
          APP_NAME: SAKHISAHAY
          APP_ENV: testing
          DEBUG: "true"
          SECRET_KEY: testing-secret-key-must-be-at-least-64-characters-long-for-tests
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DB_NAME: sakhisahay_test
          PYTHONPATH: .
        run: |
          pytest backend/tests -v --cov=backend/app --cov-report=term-missing --cov-report=xml

  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Production Build
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: /api/v1
        run: npm run build
